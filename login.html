
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paie Taïwan — Connexion</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #f3f5f8;
    padding: 24px;
  }
  main {
    max-width: 420px;
    margin: 60px auto;
    padding: 28px;
    background: white;
    border-radius: 16px;
  }
  input, button {
    box-sizing: border-box;
    display: block;
    width: 100%;
    padding: 14px;
    margin: 12px 0;
    font-size: 16px;
    border-radius: 8px;
  }
  input { border: 1px solid #ccc; }
  button {
    background: #176b55;
    color: white;
    border: none;
    cursor: pointer;
  }
  button:disabled { opacity: .6; }
  [hidden] { display: none !important; }
  #message { overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h2>Paie Taïwan</h2>

  <section id="loginSection">
    <p>Connexion administrateur</p>
    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Adresse e-mail"
        autocomplete="username" required>
      <input id="password" type="password"
        placeholder="Mot de passe"
        autocomplete="current-password" required>
      <button type="submit">Se connecter</button>
    </form>
  </section>

  <section id="resetSection" hidden>
    <h3>Définir un nouveau mot de passe</h3>
    <form id="resetForm">
      <input id="newPassword" type="password"
        placeholder="Nouveau mot de passe"
        autocomplete="new-password"
        minlength="12" required>
      <input id="confirmPassword" type="password"
        placeholder="Confirmer le mot de passe"
        autocomplete="new-password"
        minlength="12" required>
      <button type="submit">
        Enregistrer le nouveau mot de passe
      </button>
    </form>
  </section>

  <section id="connectedSection" hidden>
    <p>Connexion administrateur réussie.</p>
    <button id="logout">Se déconnecter</button>
  </section>

  <p id="message" role="status"></p>
</main>

<script type="module">
import { createClient } from
  "https://esm.sh/@supabase/supabase-js@2";

// REMPLACER PAR TES DEUX VALEURS
const SUPABASE_URL =
  "https://sjsdmzvmuugrpxewhflz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_k_H4nkAEc2tzmppak1h8ww_nz2T8kbB";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginSection =
  document.getElementById("loginSection");
const resetSection =
  document.getElementById("resetSection");
const connectedSection =
  document.getElementById("connectedSection");
const message =
  document.getElementById("message");

let recoveryMode = false;

function show(section) {
  loginSection.hidden = section !== "login";
  resetSection.hidden = section !== "reset";
  connectedSection.hidden = section !== "connected";
}

async function verifyAdmin() {
  const { data: { user }, error } =
    await supabase.auth.getUser();

  if (error || !user) {
    show("login");
    return;
  }

  const { data: isAdmin, error: roleError } =
    await supabase.rpc("is_payroll_admin");

  if (roleError || isAdmin !== true) {
    await supabase.auth.signOut();
    show("login");
    message.textContent =
      "Compte non autorisé.";
    return;
  }

  window.location.replace(".index.html");
}

supabase.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    recoveryMode = true;
    show("reset");
    message.textContent =
      "Choisis un nouveau mot de passe.";
  }
});

document.getElementById("loginForm")
  .addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = event.submitter;
    button.disabled = true;
    message.textContent = "Connexion en cours…";

    try {
      const email =
        document.getElementById("email").value;
      const password =
        document.getElementById("password").value;

      const { error } =
        await supabase.auth.signInWithPassword({
          email, password
        });

      if (error) {
        message.textContent =
          "Connexion impossible. Vérifie tes identifiants.";
      } else {
        await verifyAdmin();
      }
    } catch {
      message.textContent =
        "Erreur de connexion.";
    } finally {
      button.disabled = false;
    }
  });

document.getElementById("resetForm")
  .addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!recoveryMode) {
      message.textContent =
        "Ouvre d'abord un lien de récupération valide.";
      return;
    }

    const password =
      document.getElementById("newPassword").value;
    const confirmation =
      document.getElementById("confirmPassword").value;

    if (password !== confirmation) {
      message.textContent =
        "Les mots de passe ne correspondent pas.";
      return;
    }

    const button = event.submitter;
    button.disabled = true;

    try {
      const { data: { user } } =
        await supabase.auth.getUser();

      if (!user) {
        throw new Error("Session expirée");
      }

      const { error } =
        await supabase.auth.updateUser({
          password
        });

      if (error) throw error;

      recoveryMode = false;
      await supabase.auth.signOut();
      show("login");
      message.textContent =
        "Mot de passe modifié. Connecte-toi.";
    } catch {
      message.textContent =
        "Réinitialisation impossible. Demande un nouveau lien.";
    } finally {
      button.disabled = false;
    }
  });

document.getElementById("logout")
  .addEventListener("click", async () => {
    await supabase.auth.signOut();
    show("login");
    message.textContent = "Déconnecté.";
  });

async function initialize() {
  // Laisser Supabase traiter le lien de récupération.
  await new Promise(resolve => setTimeout(resolve, 800));
  if (!recoveryMode) {
    await verifyAdmin();
  }
}

initialize().catch(() => {
  message.textContent =
    "Impossible de vérifier la session.";
});
</script>
</body>
</html>
